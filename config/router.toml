mode = "router"
connect.endpoints = []
listen.endpoints = ["quic/[::]:4700"]

[transport]
unicast.max_links = 4
unicast.compression.enabled = true
[transport.link]
[transport.link.tls]
enable_mtls = false
verify_name_on_connect = false
root_ca_certificate = "config/cert/ca_cert.pem"
listen_certificate = "config/cert/server_cert.pem"
listen_private_key = "config/cert/server_key.pem"

[scouting]
gossip.enabled = false
multicast.enabled = false

[routing]
peer.mode = "peer_to_peer"
router.peers_failover_brokering = true
